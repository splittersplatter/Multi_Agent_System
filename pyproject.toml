[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-election"
version = "0.1.0"
description = "Reproducible political multi-agent election simulation"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Research project"}]
dependencies = []

[project.optional-dependencies]
visualization = ["Pillow==12.1.1"]

[project.scripts]
multi-agent-election = "multi_agent_election.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multi_agent_election = ["web/*"]
