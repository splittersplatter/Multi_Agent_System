parties = ["A", "B", "C"]
k = 1
seed = 1
rounds = 25

[groups.committed]
voting = "sincere"
movement = "random_walk"
max_step = 0.015
communication = "truthful"

[groups.committed.parameters]
movement = { distribution = "uniform" }

[groups.trusting]
voting = "local_plurality"
movement = "random_walk"
max_step = 0.015
communication = "truthful"

[groups.trusting.parameters]
movement = { distribution = "uniform" }

[groups.sensor]
voting = "sensed_plurality"
movement = "random_walk"
max_step = 0.015
communication = "truthful"
capabilities = { sense_public_ballots = true }

[groups.sensor.parameters]
movement = { distribution = "uniform" }

[groups.spies]
voting = "sincere"
movement = "random_walk"
max_step = 0.01
communication = "none"

[groups.spies.parameters]
target = "B"
mode = "blind"
movement = { distribution = "uniform" }

[groups.spies.capabilities]
observe_target_preferences = false
intercept_private_reports = false
receive_private_reports = true
send_private_reports = true

