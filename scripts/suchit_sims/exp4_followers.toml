parties = ["Left", "Right", "Centre"]
k = 1
seed = 20
rounds = 40

[groups.loyal_centre]
voting = "sincere"
movement = "random_walk"
max_step = 0.03
proximity_radius = 0.2

[groups.loyal_centre.parameters]
movement = { distribution = "uniform" }

[groups.sincere]
voting = "sincere"
movement = "random_walk"
max_step = 0.03
proximity_radius = 0.2

[groups.sincere.parameters]
movement = { distribution = "uniform" }

[groups.front_runner]
voting = "top_k"
movement = "random_walk"
max_step = 0.03
proximity_radius = 0.2
capabilities = { sense_public_ballots = true }

[groups.front_runner.parameters]
voting = { top_k = 2 }
movement = { distribution = "uniform" }

[groups.copycat]
voting = "sensed_plurality"
movement = "random_walk"
max_step = 0.03
proximity_radius = 0.2
capabilities = { sense_public_ballots = true }

[groups.copycat.parameters]
movement = { distribution = "uniform" }

[groups.pivot_seeker]
voting = "pivotal"
movement = "random_walk"
max_step = 0.03
proximity_radius = 0.2
capabilities = { sense_public_ballots = true }

[groups.pivot_seeker.parameters]
movement = { distribution = "uniform" }

