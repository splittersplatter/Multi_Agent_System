parties = ["A", "B", "C"]
k = 2
seed = 7
rounds = 60

[groups.copycats]
voting = "sensed_plurality"
movement = "random_walk"
max_step = 0.012
proximity_radius = 0.1
communication = "truthful"
capabilities = { sense_public_ballots = true }

[groups.committed]
voting = "sincere"
movement = "random_walk"
max_step = 0.012
proximity_radius = 0.1
communication = "truthful"

[groups.poll_watchers]
voting = "signal_confident"
movement = "random_walk"
max_step = 0.012
proximity_radius = 0.1
communication = "truthful"
capabilities = { observe_public_signal = true }

[groups.team_A]
voting = "sincere"
movement = "python:echo_campaign:move"
max_step = 0.06
graph = "python:echo_campaign:link"
proximity_radius = 0.3
communication = "truthful"
capabilities = { sense_public_ballots = true, observe_electorate = true, modify_persistent_edges = true }

