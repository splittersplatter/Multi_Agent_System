parties = ["A", "B", "C"]
k = 2
seed = 7
rounds = 60

[groups.copycats]
voting = "sensed_plurality"
movement = "random_walk"
max_step = 0.012
proximity_radius = 0.1
communication = "truthful"
capabilities = { sense_public_ballots = true }

[groups.copycats.parameters]
movement = { distribution = "uniform" }

[groups.committed]
voting = "sincere"
movement = "random_walk"
max_step = 0.012
proximity_radius = 0.1
communication = "truthful"

[groups.committed.parameters]
movement = { distribution = "uniform" }

[groups.poll_watchers]
voting = "signal_confident"
movement = "random_walk"
max_step = 0.012
proximity_radius = 0.1
communication = "truthful"
capabilities = { observe_public_signal = true }

[groups.poll_watchers.parameters]
movement = { distribution = "uniform" }

[groups.team_A]
voting = "sincere"
movement = "python:echo_campaign:move"
max_step = 0.06
graph = "python:echo_campaign:link"
proximity_radius = 0.3
communication = "truthful"
capabilities = { sense_public_ballots = true, observe_electorate = true, modify_persistent_edges = true }

[groups.team_A.parameters]
strategy = "infiltrate"
party = "A"
home = [0.22, 0.28]
rival = [0.78, 0.28]
max_step = 0.06
max_active = 6
new_per_round = 2
campaigners = ["campA0", "campA1", "campA2", "campA3", "campB0", "campB1", "campB2", "campB3", "campC0", "campC1", "campC2", "campC3"]

[groups.team_B]
voting = "sincere"
movement = "python:echo_campaign:move"
max_step = 0.06
graph = "python:echo_campaign:link"
proximity_radius = 0.3
communication = "truthful"
capabilities = { sense_public_ballots = true, observe_electorate = true, modify_persistent_edges = true }

[groups.team_B.parameters]
strategy = "bridge"
party = "B"
home = [0.78, 0.28]
rival = [0.22, 0.28]
max_step = 0.06
max_active = 6
new_per_round = 2
campaigners = ["campA0", "campA1", "campA2", "campA3", "campB0", "campB1", "campB2", "campB3", "campC0", "campC1", "campC2", "campC3"]

[groups.team_C]
voting = "sincere"
movement = "python:echo_campaign:move"
max_step = 0.06
graph = "python:echo_campaign:link"
proximity_radius = 0.3
communication = "truthful"
capabilities = { sense_public_ballots = true, observe_electorate = true, modify_persistent_edges = true }

[groups.team_C.parameters]
strategy = "fortify"
party = "C"
home = [0.5, 0.78]
rival = [0.22, 0.28]
max_step = 0.06
max_active = 6
new_per_round = 2
campaigners = ["campA0", "campA1", "campA2", "campA3", "campB0", "campB1", "campB2", "campB3", "campC0", "campC1", "campC2", "campC3"]

[network]
radius = 0.1

[campaign_controller]
target = "B"
policy = "target_heuristic"
per_round_budget = 1
lifetime_budget = 15

[signal_controller]
target = "C"
policy = "target_biased"
schedule = "repeated"
per_broadcast_budget = 3
lifetime_budget = 60

[detector]
target = "C"
threshold = 0.05

