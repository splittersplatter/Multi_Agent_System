parties = ["A", "B", "C"]
k = 1
seed = 6
rounds = 30

[groups.committed]
voting = "sincere"
movement = "random_walk"
max_step = 0.015
communication = "truthful"

[groups.trusting]
voting = "local_plurality"
movement = "random_walk"
max_step = 0.015
communication = "truthful"

[groups.sensor]
voting = "sensed_plurality"
movement = "random_walk"
max_step = 0.015
communication = "truthful"
capabilities = { sense_public_ballots = true }

[groups.spies]
voting = "sincere"
movement = "random_walk"
max_step = 0.01
communication = "none"
parameters = { target = "B", mode = "blind" }

[groups.spies.capabilities]
observe_target_preferences = false
intercept_private_reports = false
receive_private_reports = true
send_private_reports = true

[network]
radius = 0.22
persistent_edges = [["spy0", "r22"], ["spy0", "r08"], ["spy0", "r07"], ["spy0", "r23"], ["spy0", "r10"], ["spy0", "r00"], ["spy1", "r18"], ["spy1", "r14"], ["spy1", "r03"], ["spy1", "r15"], ["spy1", "r24"], ["spy1", "r06"], ["spy2", "r19"], ["spy2", "r20"], ["spy2", "r04"], ["spy2", "r17"], ["spy2", "r22"], ["spy2", "r07"], ["spy3", "r02"], ["spy3", "r05"], ["spy3", "r00"], ["spy3", "r23"], ["spy3", "r08"], ["spy3", "r22"], ["spy4", "r04"], ["spy4", "r07"], ["spy4", "r19"], ["spy4", "r22"], ["spy4", "r17"], ["spy4", "r08"]]

