<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Download probe</title></head>
<body>
  <a href="download-probe.html" download="download-probe.html">Download regular file</a>
  <button id="blob">Download Blob</button>
  <script>
    document.getElementById("blob").addEventListener("click", () => {
      const url = URL.createObjectURL(new Blob(["download probe"], {type: "text/plain"}));
      const link = document.createElement("a");
      link.href = url; link.download = "download-probe.txt";
      document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    });
  </script>
</body>
</html>
