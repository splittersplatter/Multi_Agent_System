# 200 distinct voters; sincere ballots, moving proximity, passive memory estimates.
# Initial poll samples 100 voters; generated from pilot seed 101.
parties = ["A", "B", "C"]
k = 1
seed = 101
rounds = 100

[majority_estimation]
poll_counts = [44, 33, 23]
memory_rounds = 10
poll_weight = 0.5 # only used when poll_refresh_rounds is absent
poll_refresh_rounds = 10 # publish completed global tally; decay weight between polls

[network]
radius = 0.12

[groups.people]
voting = "sincere"
movement = "random_walk"
max_step = 0.05 # hard movement cap; mean step remains 0.025
communication = "none"
parameters = { movement = { distribution = "normal", mean_step = 0.025, std_step = 0.00625 } }

