# 200 voters; memory-pivotal, Gaussian motion, rolling contacts, truthful periodic tally.
# Exploratory frequencies only; no absorption, mixing-time or occupation theorem.
parties = ["A", "B", "C"]
k = 1
seed = 101
rounds = 10000

[majority_estimation]
poll_counts = [44, 33, 23]
memory_rounds = 10
poll_weight = 0.5
poll_refresh_rounds = 10

[network]
radius = 0.12

[groups.people]
voting = "memory_pivotal"
movement = "random_walk"
max_step = 0.05
communication = "none"
parameters = { movement = { distribution = "normal", mean_step = 0.025, std_step = 0.00625 } }

