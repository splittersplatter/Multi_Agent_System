# Finite-grid200: new explicit integer positions, not snapped continuous trajectories.
# Opt-in strict domain; ideal IID occupation theorem != seeded-path certificate.
parties = ["A", "B", "C"]
k = 1
seed = 101
rounds = 10000

[stochastic_stability]
case = "finite_grid_occupation_v1"

[majority_estimation]
poll_counts = [44, 33, 23]
memory_rounds = 10
poll_weight = 0.5
poll_refresh_rounds = 10

[network]
radius = 0.12

[groups.people]
voting = "memory_pivotal"
movement = "grid_walk"
max_step = 0.025
communication = "none"

